<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Pillowcase Playlist (Lil Uzi Vert)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

        body { 
            font-family: 'VT323', monospace;
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Uzi Background Video */
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.28;
            filter: blur(6px) brightness(0.75) contrast(1.15);
        }

        #background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10,10,10,0.88), rgba(26,0,51,0.92));
            z-index: -1;
        }

        h1 { 
            margin: 10px 0 5px; 
            font-family: 'Press Start 2P', cursive;
            color: #ff4d94;
            text-shadow: 0 0 15px #ff4d94, 0 0 30px #bb86fc;
            letter-spacing: 4px;
        }
        .subtitle { 
            color: #bb86fc; 
            margin-bottom: 20px; 
            text-shadow: 0 0 10px #bb86fc;
        }
        
        #controls {
            position: sticky;
            top: 0;
            z-index: 100;
            max-width: 720px;
            margin: 0 auto 20px;
            background: rgba(26, 26, 26, 0.96);
            border: 3px solid #ff4d94;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 30px #ff4d94, 0 0 50px rgba(187, 134, 252, 0.5);
        }
        
        #now-playing { 
            background: #1a0033; 
            padding: 18px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            text-align: left; 
            border: 2px solid #bb86fc;
            box-shadow: inset 0 0 15px rgba(255, 77, 148, 0.4);
        }

        button { 
            padding: 12px 16px; 
            margin: 4px; 
            background: #1f1f1f; 
            color: #fff; 
            border: 2px solid #bb86fc;
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'VT323', monospace;
            font-size: 18px;
            transition: all 0.2s;
        }
        button:hover { 
            background: #ff4d94; 
            color: #000;
            transform: scale(1.05);
            box-shadow: 0 0 20px #ff4d94;
        }

        .song-btn { 
            display: block; 
            width: 100%; 
            max-width: 720px; 
            margin: 8px auto; 
            padding: 16px; 
            background: rgba(31,31,31,0.95); 
            color: #fff; 
            border: 2px solid #444;
            border-radius: 12px; 
            text-align: left; 
            cursor: pointer; 
            position: relative;
            transition: all 0.2s;
        }
        .song-btn:hover { 
            background: #2a002a; 
            border-color: #ff4d94;
            transform: translateX(8px);
        }
        .song-btn.playing { 
            background: linear-gradient(90deg, #4a2b8a, #ff4d94);
            border-color: #bb86fc;
            box-shadow: 0 0 25px #ff4d94;
        }

        .heart { 
            float: right; 
            font-size: 26px; 
            cursor: pointer; 
            color: #666; 
            user-select: none;
        }
        .heart.liked { color: #ff4d94; }

        .song-btn .download { 
            float: right; 
            margin-left: 12px; 
            font-size: 20px; 
            color: #bb86fc;
        }
    </style>
</head>
<body>

    <!-- Your Uzi Video Background -->
    <video id="background-video" autoplay loop muted playsinline>
        <source src="https://files.catbox.moe/88gc6t.mp4" type="video/mp4">
    </video>
    <div id="background-overlay"></div>

    <h1>💎 PILLOWCASE 💎</h1>
    <div class="subtitle">LUV IS RAGE • LIL UZI VERT ARCHIVE</div>

    <div class="filters">
        <select id="era-filter">
            <option value="">ALL ERAS</option>
        </select>
        <input type="text" id="search" placeholder="SEARCH TRACKS OR NOTES..." style="flex:1; max-width:400px;">
    </div>

    <div id="controls">
        <div id="now-playing">
            <strong>NOW PLAYING:</strong> 
            <span id="current-title">—</span><br>
            <span id="current-notes" style="font-size:1.1em; color:#bb86fc;"></span>
            
            <div class="now-playing-controls">
                <button id="fav-current-btn" style="padding:8px 14px; font-size:26px; background:none; border:2px solid #ff4d94;">♡</button>
            </div>
        </div>

        <div>
            <button id="shuffle-btn">🔀 SHUFFLE</button>
            <button id="repeat-btn">🔁</button>
            <button id="prev-btn">⏮️</button>
            <button id="play-pause-btn">▶️</button>
            <button id="next-btn">⏭️</button>
        </div>

        <input type="range" id="progress" style="width:100%; margin:15px 0;" value="0">
        <div style="display:flex; justify-content:space-between; font-size:1.1em; color:#bb86fc;">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div style="margin-top:10px;">
            <label style="color:#bb86fc;">VOLUME: </label>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1" style="width:220px;">
        </div>
    </div>

    <div class="collapsible" onclick="toggleFavorites()" style="cursor:pointer; padding:15px; background:#1a0033; border:2px solid #ff4d94; border-radius:12px; margin:20px auto; max-width:720px;">
        ❤️ FAVORITES (<span id="fav-count">0</span>)
    </div>
    <div id="favorites-list" style="display:none; margin-bottom:20px;"></div>

    <div id="playlist"></div>

    <script>
        let songs = [];
        let currentIndex = -1;
        let isShuffle = false;
        let repeatMode = 0;
        let audio = new Audio();
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let currentEraFilter = "";

        fetch("tracker.tsv")
            .then(res => res.text())
            .then(text => {
                const lines = text.trim().split('\n');
                songs = [];
                for (let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split('\t');
                    if (cols.length < 5) continue;

                    let rawLinks = (cols[cols.length - 1] || "").trim();
                    let pillowLink = "";
                    const linkMatch = rawLinks.match(/https:\/\/pillows\.su\/f\/[^\s]+/);
                    if (linkMatch) pillowLink = linkMatch[0];

                    let playableLink = pillowLink ? 
                        `https://api.pillows.su/api/get/${pillowLink.split('/f/')[1].split('?')[0]}` : "";

                    if (playableLink) {
                        const era = cols[0] || "Unknown";
                        songs.push({
                            name: cols[1] || "Untitled",
                            notes: cols[2] || "",
                            era: era,
                            link: playableLink,
                            pillowLink: pillowLink
                        });
                    }
                }

                populateEraFilter();
                renderPlaylist(filterSongs());
                renderFavorites();
                if (songs.length) playRandomSong();
            });

        function populateEraFilter() {
            const eras = [...new Set(songs.map(s => s.era))].sort();
            const select = document.getElementById('era-filter');
            eras.forEach(era => {
                const opt = document.createElement('option');
                opt.value = era;
                opt.textContent = era;
                select.appendChild(opt);
            });
            
            select.onchange = () => {
                currentEraFilter = select.value;
                renderPlaylist(filterSongs());
            };
        }

        function filterSongs() {
            const term = document.getElementById('search').value.toLowerCase();
            return songs.filter(song => {
                const eraMatch = !currentEraFilter || song.era === currentEraFilter;
                const textMatch = !term || 
                    song.name.toLowerCase().includes(term) || 
                    (song.notes && song.notes.toLowerCase().includes(term));
                return eraMatch && textMatch;
            });
        }

        function playSong(index) {
            if (index < 0 || index >= songs.length) return;
            currentIndex = index;
            const song = songs[currentIndex];
            
            audio.src = song.link;
            audio.play().catch(e => {
                console.error("Playback failed:", e);
                alert("Could not play this track. Link might be dead.");
            });

            updateNowPlaying();
            renderPlaylist(filterSongs());
            renderFavorites();
        }

        function updateNowPlaying() {
            const song = songs[currentIndex];
            if (!song) return;

            document.getElementById('current-title').innerHTML = 
                `<a href="${song.pillowLink}" target="_blank">${song.name}</a>`;

            document.getElementById('current-notes').innerHTML = 
                `<strong>Era:</strong> ${song.era}<br><strong>Notes:</strong> ${song.notes || '—'}`;

            updateFavCurrentButton();
        }

        function updateFavCurrentButton() {
            const btn = document.getElementById('fav-current-btn');
            const isLiked = favorites.includes(currentIndex);
            btn.textContent = isLiked ? '❤️' : '♡';
            btn.style.color = isLiked ? '#ff4d94' : '#bb86fc';
        }

        function playRandomSong() {
            currentIndex = Math.floor(Math.random() * songs.length);
            playSong(currentIndex);
        }

        function nextSong() {
            if (repeatMode === 2) return playSong(currentIndex);
            let nextIdx = currentIndex;
            if (isShuffle) {
                do { nextIdx = Math.floor(Math.random() * songs.length); } 
                while (nextIdx === currentIndex && songs.length > 1);
            } else {
                nextIdx = (currentIndex + 1) % songs.length;
            }
            playSong(nextIdx);
        }

        function prevSong() {
            let prevIdx = isShuffle ? 
                Math.floor(Math.random() * songs.length) : 
                (currentIndex - 1 + songs.length) % songs.length;
            playSong(prevIdx);
        }

        function renderPlaylist(filteredSongs) {
            const container = document.getElementById('playlist');
            container.innerHTML = '';
            
            filteredSongs.forEach(song => {
                const globalIdx = songs.indexOf(song);
                const isPlaying = globalIdx === currentIndex;
                const isLiked = favorites.includes(globalIdx);

                const btn = document.createElement('button');
                btn.className = `song-btn ${isPlaying ? 'playing' : ''}`;
                
                btn.innerHTML = `
                    ▶ ${song.name}
                    <a href="${song.pillowLink}" target="_blank" class="download" title="Download">⬇</a>
                    <span class="heart ${isLiked ? 'liked' : ''}" onclick="event.stopImmediatePropagation(); toggleFavorite(${globalIdx});">
                        ${isLiked ? '❤️' : '♡'}
                    </span>
                `;
                
                btn.onclick = () => playSong(globalIdx);
                container.appendChild(btn);
            });
        }

        function toggleFavorite(idx) {
            if (favorites.includes(idx)) {
                favorites = favorites.filter(i => i !== idx);
            } else {
                favorites.push(idx);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderPlaylist(filterSongs());
            renderFavorites();
            if (idx === currentIndex) updateFavCurrentButton();
        }

        function renderFavorites() {
            const container = document.getElementById('favorites-list');
            const countEl = document.getElementById('fav-count');
            container.innerHTML = '';

            const favSongs = favorites.map(idx => songs[idx]).filter(Boolean);
            countEl.textContent = favSongs.length;

            favSongs.forEach(song => {
                const globalIdx = songs.indexOf(song);
                const btn = document.createElement('button');
                btn.className = `song-btn ${globalIdx === currentIndex ? 'playing' : ''}`;
                btn.innerHTML = `
                    ▶ ${song.name}
                    <a href="${song.pillowLink}" target="_blank" class="download">⬇</a>
                    <span class="heart liked" onclick="event.stopImmediatePropagation(); toggleFavorite(${globalIdx});">❤️</span>
                `;
                btn.onclick = () => playSong(globalIdx);
                container.appendChild(btn);
            });
        }

        function toggleFavorites() {
            const list = document.getElementById('favorites-list');
            list.style.display = list.style.display === 'none' ? 'block' : 'none';
        }

        // Event Listeners
        document.getElementById('play-pause-btn').onclick = () => audio.paused ? audio.play() : audio.pause();
        document.getElementById('next-btn').onclick = nextSong;
        document.getElementById('prev-btn').onclick = prevSong;
        
        document.getElementById('shuffle-btn').onclick = () => {
            isShuffle = !isShuffle;
            document.getElementById('shuffle-btn').classList.toggle('active', isShuffle);
        };

        document.getElementById('repeat-btn').onclick = () => {
            repeatMode = (repeatMode + 1) % 3;
            const btn = document.getElementById('repeat-btn');
            btn.textContent = repeatMode === 0 ? '🔁' : repeatMode === 1 ? '🔁' : '🔂';
            btn.classList.toggle('active', repeatMode > 0);
        };

        document.getElementById('fav-current-btn').onclick = () => {
            if (currentIndex >= 0) toggleFavorite(currentIndex);
        };

        document.getElementById('search').onkeyup = () => renderPlaylist(filterSongs());

        const volumeSlider = document.getElementById('volume');
        volumeSlider.oninput = () => audio.volume = volumeSlider.value;

        const progress = document.getElementById('progress');
        audio.ontimeupdate = () => {
            if (audio.duration) {
                progress.value = (audio.currentTime / audio.duration) * 100;
                document.getElementById('current-time').textContent = formatTime(audio.currentTime);
            }
        };

        progress.oninput = e => {
            if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
        };

        audio.onloadedmetadata = () => {
            document.getElementById('duration').textContent = formatTime(audio.duration);
        };

        audio.onended = () => {
            if (repeatMode === 2) playSong(currentIndex);
            else nextSong();
        };

        function formatTime(s) {
            if (!s || isNaN(s)) return "0:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT') return;
            switch(e.key) {
                case ' ': e.preventDefault(); audio.paused ? audio.play() : audio.pause(); break;
                case 'ArrowRight': nextSong(); break;
                case 'ArrowLeft': prevSong(); break;
                case 'f': case 'F': if (currentIndex >= 0) toggleFavorite(currentIndex); break;
            }
        });
    </script>
</body>
</html>
